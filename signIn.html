<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | HBO Max</title>
    <link rel="stylesheet" href="assets/signIn.css">
</head>
<body class="primary-color text-color">
    <nav class="nav-bg-color">
        <div class="logo">
            <img width="100" src="assets/images/hbo-logo.svg" alt="Logo da HBO Max">
        </div>
        <div class="login">
            <h5>ENTRAR</h5>
            <button class="tertiary-color text-color">ASSINE AGORA</button>
        </div>
    </nav>

    <main>
        <form class="container">
            <div class="entrar">
                <h3>ENTRAR</h3>
            </div>
            <div class="loginn">
                <p>Você tem uma conta da HBO Max?</p>
                <input class="text-color" type="email" placeholder="Endereço de e-mail" required>
                <input class="text-color" type="password" placeholder="Senha     (mínimo de 8 dígitos)" minlength="8" required>
            </div>
            <div class="esqueceu-senha">
                <button class="btn-bg-color-gradient text-color" type="submit">ENTRAR</button>
                <span>Esqueceu a senha?</span>
            </div>
        </form>
    </main>

    <footer>
        <div class="links">
            <div><a href="">AGORA NA HBO MAX</a></div>
            <div><a href="">EM BREVE</a></div>
            <div><a href="">FILMES EM DESTAQUE</a></div>
            <div><a href="">SÉRIES</a></div>
            <div><a href="">AJUDA</a></div>   
        </div>
        <div class="direitos">
            <P>© 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.</P>
        </div>
        <div class="redes">
            <img src="assets/images/fb_0.png" alt="">
            <img src="assets/images/twitter_0.png" alt="">
            <img src="assets/images/instagram_0.png" alt="">
            <img src="assets/images/youtube_0.png" alt="">
        </div>
    </footer>
</body>
</html>
